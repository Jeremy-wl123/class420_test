name: CI-CD自动部署

# 触发条件：push到main分支就执行流水线
on:
  push:
    branches: [ main ]

jobs:
  deploy_job:
    runs-on: ubuntu-latest
    steps:
      # ① 拉取github仓库代码到运行器
      - name: 拉取代码
        uses: actions/checkout@v4

      # ② SSH连接你的服务器，执行部署脚本
      - name: SSH登录服务器执行部署
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_SERVER_HOST }}
          username: ${{ secrets.SSH_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "==== CI/CD流水线开始部署 ===="
            # =========这里写你服务器要执行的命令=========
            # 示例：进入项目目录、git拉最新代码、重启服务
            # cd /opt/my_project
            # git pull origin main
            # systemctl restart your-service
            echo "部署执行完毕"
